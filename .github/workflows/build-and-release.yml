name: Build and release patched WinBox

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Patch the binary (patch set v1)
        shell: pwsh
        run: ./build-patched-v1.ps1

      - name: Patch the binary (patch set v2)
        shell: pwsh
        run: python ./build-patched-v2.py

      - name: Patch the binary (patch set v3)
        shell: pwsh
        run: python ./build-patched-v3.py

      - name: Patch the binary (patch set v4)
        shell: pwsh
        run: python ./build-patched-v4.py

      - name: Patch the binary (patch set v5)
        shell: pwsh
        run: python ./build-patched-v5.py

      - name: Patch the binary (patch set v6)
        shell: pwsh
        run: python ./build-patched-v6.py

      - name: Patch the binary (patch set v7)
        shell: pwsh
        run: python ./build-patched-v7.py

      - name: Verify SHA-256
        shell: pwsh
        run: |
          $h1 = (Get-FileHash ./winbox64.v3.43p1.exe -Algorithm SHA256).Hash.ToLower()
          $h2 = (Get-FileHash ./winbox64.v3.43p2.exe -Algorithm SHA256).Hash.ToLower()
          $h3 = (Get-FileHash ./winbox64.v3.43p3.exe -Algorithm SHA256).Hash.ToLower()
          if ($h1 -ne 'acfc8034b662cdabd4ead6a590194a2274dc41358f1b0cda71db9a752b2c4ea4') {
            throw "patch set v1 SHA-256 mismatch: $h1"
          }
          if ($h2 -ne '8b0bc24fcfdbd7eee6109d4593ad3aedecb4fc28786133acc71ed051c61aea20') {
            throw "patch set v2 SHA-256 mismatch: $h2"
          }
          if ($h3 -ne '4c7223fdf60eb4293db413db712aa89a786180eff7074398630dfc21c6f29d6a') {
            throw "patch set v3 SHA-256 mismatch: $h3"
          }
          $h4 = (Get-FileHash ./winbox64.v3.43p4.exe -Algorithm SHA256).Hash.ToLower()
          if ($h4 -ne '4b861b5a0508df19b93b888453a1072e94c8feddd760a3a6f7fa864c8b1de1dd') {
            throw "patch set v4 SHA-256 mismatch: $h4"
          }
          $h5 = (Get-FileHash ./winbox64.v3.43p5.exe -Algorithm SHA256).Hash.ToLower()
          if ($h5 -ne '84999acf0cc20179ab8e77d0cb16e0cabd4fd756aafcebf946e790cc783016a7') {
            throw "patch set v5 SHA-256 mismatch: $h5"
          }
          $h6 = (Get-FileHash ./winbox64.v3.43p6.exe -Algorithm SHA256).Hash.ToLower()
          if ($h6 -ne 'bb46e3e83cff5bbb4098aba4e7960cd7bf71bf697ff9a580762c6718206fd256') {
            throw "patch set v6 SHA-256 mismatch: $h6"
          }
          $h7 = (Get-FileHash ./winbox64.v3.43p7.exe -Algorithm SHA256).Hash.ToLower()
          if ($h7 -ne 'f2e3e610618cbd0d79044d53005a679c421876b886a840c4e5f06febab5ad857') {
            throw "patch set v7 SHA-256 mismatch: $h7"
          }
          "Verified v1: $h1"
          "Verified v2: $h2"
          "Verified v3: $h3"
          "Verified v4: $h4"
          "Verified v5: $h5"
          "Verified v6: $h6"
          "Verified v7: $h7"

      - name: Publish GitHub Release (patch set v1)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag   = 'patched-v1'
          $title = 'WinBox 3.43p1'
          $sha   = $env:GITHUB_SHA
          $notes = "Patch set v1 - RouterOS 7.25 compatibility patches only.`n" +
                   "Built automatically from commit $sha.`n`n" +
                   "winbox64.v3.43p1.exe is byte-identical to the known-good community-patched build`n" +
                   "(SHA-256 acfc8034b662cdabd4ead6a590194a2274dc41358f1b0cda71db9a752b2c4ea4).`n`n" +
                   "Place icons16/24/32.png next to the exe so WinBox can find its icons.`n" +
                   "See the README for details on what each patch does."
          $assets = @('winbox64.v3.43p1.exe', 'icons/icons16.png', 'icons/icons24.png', 'icons/icons32.png')
          if (gh release view $tag --json name -q '.name') {
            "Release '$tag' already exists - nothing to do (build is deterministic)"
          } else {
            gh release create $tag @assets --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed for '$tag'" }
            "Created release '$tag'"
          }

      - name: Publish GitHub Release (patch set v2)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag   = 'patched-v2'
          $title = 'WinBox 3.43p2'
          $sha   = $env:GITHUB_SHA
          $notes = "Patch set v2 - v1 + embedded icons + version stamp 3.43.102.38.`n" +
                   "Built automatically from commit $sha.`n`n" +
                   "winbox64.v3.43p2.exe is byte-identical to the known-good community-patched build`n" +
                   "(SHA-256 8b0bc24fcfdbd7eee6109d4593ad3aedecb4fc28786133acc71ed051c61aea20).`n`n" +
                   "Self-contained: icons are embedded and unpacked to %TEMP% at startup -`n" +
                   "no files needed next to the exe.`n" +
                   "See the README for details on what each patch does."
          $assets = @('winbox64.v3.43p2.exe')
          if (gh release view $tag --json name -q '.name') {
            "Release '$tag' already exists - nothing to do (build is deterministic)"
          } else {
            gh release create $tag @assets --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed for '$tag'" }
            "Created release '$tag'"
          }

      - name: Publish GitHub Release (patch set v3)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag   = 'patched-v3'
          $title = 'WinBox 3.43p3'
          $sha   = $env:GITHUB_SHA
          $notes = "Patch set v3 - v2 + Win11 launch fix + Switch icon (CHR) + Format Drive crash fix,`n" +
                   "version stamp 3.43.102.83.`n" +
                   "Built automatically from commit $sha.`n`n" +
                   "winbox64.v3.43p3.exe is byte-identical to the known-good community-patched build`n" +
                   "(SHA-256 4c7223fdf60eb4293db413db712aa89a786180eff7074398630dfc21c6f29d6a).`n`n" +
                   "Self-contained: icons are embedded and unpacked to %TEMP% at startup -`n" +
                   "no files needed next to the exe.`n" +
                   "See the README for details on what each patch does."
          $assets = @('winbox64.v3.43p3.exe')
          if (gh release view $tag --json name -q '.name') {
            "Release '$tag' already exists - nothing to do (build is deterministic)"
          } else {
            gh release create $tag @assets --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed for '$tag'" }
            "Created release '$tag'"
          }

      - name: Publish GitHub Release (patch set v4)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag   = 'patched-v4'
          $title = 'WinBox 3.43p4'
          $sha   = $env:GITHUB_SHA
          $notes = "Patch set v4 - v3 + bytes/bigbytes value editor fixes, version stamp 3.43.102.98.`n" +
                   "Built automatically from commit $sha.`n`n" +
                   "winbox64.v3.43p4.exe is byte-identical to the known-good community-patched build`n" +
                   "(SHA-256 4b861b5a0508df19b93b888453a1072e94c8feddd760a3a6f7fa864c8b1de1dd).`n`n" +
                   "Fixes red, uneditable bytes/bigbytes fields (MTU, Container Shm Size, tmpfs/memory limits, disk sizes) on RouterOS 7.24+.`n`n" +
                   "Self-contained: icons are embedded and unpacked to %TEMP% at startup -`n" +
                   "no files needed next to the exe.`n" +
                   "See the README for details on what each patch does."
          $assets = @('winbox64.v3.43p4.exe')
          if (gh release view $tag --json name -q '.name') {
            "Release '$tag' already exists - nothing to do (build is deterministic)"
          } else {
            gh release create $tag @assets --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed for '$tag'" }
            "Created release '$tag'"
          }

      - name: Publish GitHub Release (patch set v5)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag   = 'patched-v5'
          $title = 'WinBox 3.43p5'
          $sha   = $env:GITHUB_SHA
          $notes = "Patch set v5 - v4 + RouterOS 7.26 / initial CMR support, no version-stamp change.`n" +
                   "Built automatically from commit $sha.`n`n" +
                   "winbox64.v3.43p5.exe is byte-identical to the known-good community-patched build`n" +
                   "(SHA-256 84999acf0cc20179ab8e77d0cb16e0cabd4fd756aafcebf946e790cc783016a7).`n`n" +
                   "Fixes the crash on connect to RouterOS 7.26 with the cmr package installed,`n" +
                   "the CMR Dashboard crashes, and adds the CMR menu icons.`n`n" +
                   "Self-contained: icons are embedded and unpacked to %TEMP% at startup -`n" +
                   "no files needed next to the exe.`n" +
                   "See the README for details on what each patch does."
          $assets = @('winbox64.v3.43p5.exe')
          if (gh release view $tag --json name -q '.name') {
            "Release '$tag' already exists - nothing to do (build is deterministic)"
          } else {
            gh release create $tag @assets --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed for '$tag'" }
            "Created release '$tag'"
          }

      - name: Publish GitHub Release (patch set v6)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag   = 'patched-v6'
          $title = 'WinBox 3.43p6'
          $sha   = $env:GITHUB_SHA
          $notes = "Patch set v6 - v5 + WiFi realms-raw save fix, Container ENV TZ-widget fix, ESR usability set (Ctrl+wheel zoom, Stats >= 10^9 with thousands grouping, 'RouterOS v... via WinBox' window title, Log Entry selection, filter-value), version stamp 3.43.103.04.`n" +
                   "Built automatically from commit $sha.`n`n" +
                   "winbox64.v3.43p6.exe is byte-identical to the known-good community-patched build`n" +
                   "(SHA-256 bb46e3e83cff5bbb4098aba4e7960cd7bf71bf697ff9a580762c6718206fd256).`n`n" +
                   "Self-contained: icons are embedded and unpacked to %TEMP% at startup -`n" +
                   "no files needed next to the exe.`n" +
                   "See the README for details on what each patch does."
          $assets = @('winbox64.v3.43p6.exe')
          if (gh release view $tag --json name -q '.name') {
            "Release '$tag' already exists - nothing to do (build is deterministic)"
          } else {
            gh release create $tag @assets --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed for '$tag' (v6)" }
            "Created release '$tag'"
          }



      - name: Publish GitHub Release (patch set v7)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag   = 'patched-v7'
          $title = 'WinBox 3.43p7'
          $sha   = $env:GITHUB_SHA
          $notes = "Patch set v7 - v6 + CMR improvements (Dashboard free-shield, enmbools/tags type fixes), dynamic-version window title, Ping/Traceroute dialog fields (dropped by MikroTik already in RouterOS 7.2x), fixed the patch set 5 disappearing-fields regression (Check For Updates in System/Packages, repull/save in Container), version stamp 3.43.103.77.`n" +
                   "Built automatically from commit $sha.`n`n" +
                   "winbox64.v3.43p7.exe is byte-identical to the known-good community-patched build`n" +
                   "(SHA-256 f2e3e610618cbd0d79044d53005a679c421876b886a840c4e5f06febab5ad857).`n`n" +
                   "Self-contained: icons are embedded and unpacked to %TEMP% at startup -`n" +
                   "no files needed next to the exe.`n" +
                   "See the README for details on what each patch does."
          $assets = @('winbox64.v3.43p7.exe')
          if (gh release view $tag --json name -q '.name') {
            "Release '$tag' already exists - nothing to do (build is deterministic)"
          } else {
            gh release create $tag @assets --latest --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed for '$tag'" }
            "Created release '$tag'"
          }

